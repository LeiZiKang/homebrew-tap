name: Validate Cask

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Ruby syntax
        run: ruby -c Casks/claude-connection-watcher.rb
      - name: Check Homebrew style
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: brew style Casks/claude-connection-watcher.rb
